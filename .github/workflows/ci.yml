name: rag_poc CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: rag_poc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      manifest-path: ragcore/Cargo.toml
      extra-gates: |
        python3 test_rag.py
        cargo build --manifest-path ragcore/Cargo.toml
        RAG_REQUIRE_RUST=1 python3 test_rag.py
        python3 rust_bridge.py check_eval_results
        python3 compare_cloud_local.py --run-ab --output /tmp/cloud-local-comparison.json
        python3 -c 'import json,sys,os; p="/tmp/cloud-local-comparison.json"; d=json.load(open(p,encoding="utf-8")) if os.path.isfile(p) else {}; m=[k for k in ("rows","notes","generated_at") if k not in d]; [print(p,k,file=sys.stderr) for k in m]; sys.exit(1 if m else 0)'
