name: rag_poc CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: rag_poc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      working_directory: ragcore
      clippy_args: -D clippy::undocumented_unsafe_blocks
      extra_gates: |
        cargo build --locked
        ./target/debug/ragcore --help
        echo '{"op":"cosine","a":[1.0],"b":[1.0]}' | ./target/debug/ragcore
        echo '{"op":"check_eval_results","paths":["../eval-results.json"]}' | ./target/debug/ragcore

  secret-scan:
    uses: Seduce0068/workflows/.github/workflows/secret-gates.yml@v1
